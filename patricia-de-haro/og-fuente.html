<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#F7F5F1;color:#453E48;font-family:Montserrat;display:flex;overflow:hidden}
.band{width:120px;background:#453E48;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:44px 0}
.band img{width:58px}.vt{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:14px;letter-spacing:.55em}
.dot{width:7px;height:7px;border-radius:50%;background:#fff}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.main::before{content:"";position:absolute;inset:26px;border:1px solid rgba(69,62,72,.18)}
.eb{font-size:15px;letter-spacing:.4em;text-transform:uppercase;color:#6F6773;margin:0 0 22px}
.orn{display:flex;align-items:center;gap:16px}.orn::before,.orn::after{content:"";width:80px;height:1px;background:rgba(69,62,72,.42)}.orn i{width:6px;height:6px;border-radius:50%;background:#453E48}
h1{font-family:"Cormorant Garamond";font-style:italic;font-weight:400;font-size:112px;line-height:1;margin:22px 0 26px}
.crest{display:flex}.crest div{padding:0 34px}.crest div+div{border-left:1px solid rgba(69,62,72,.42)}
.crest b{display:block;font-family:"Cormorant Garamond";font-weight:500;font-size:52px;line-height:1}
.crest span{display:block;margin-top:8px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#6F6773}
.when{font-family:"Cormorant Garamond";font-size:30px;margin:28px 0 4px}
.where{font-size:13px;letter-spacing:.36em;text-transform:uppercase;color:#6F6773;margin:0}
</style></head><body>
<div class="band"><img src="img/mono-punto-blanco.png"><span class="vt">TRAVEL DESIGN</span><span class="dot"></span></div>
<div class="main">
<p class="eb">Hospedaje para la celebración de</p><div class="orn"><i></i></div>
<h1>Patricia de Haro</h1>
<div class="crest"><div><b>60</b><span>años</span></div><div><b>40</b><span>de casados</span></div></div>
<p class="when">12 al 14 de febrero de 2027</p><p class="where">Las Brisas · Ixtapa</p>
</div></body></html>
